<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netflix Jeopardy</title>
<!--
  ============================================================================
  NETFLIX JEOPARDY  -  single-file HTML/CSS/JS trivia game with xAPI (Docebo)
  ============================================================================

  SETUP
  -----
  1. LRS credentials
     Option A (recommended for Docebo): upload this file inside a Tin Can (xAPI)
       package zip together with tincan.xml. Docebo then launches the game with
       ?endpoint=...&auth=...&actor=...&activity_id=...&registration=... in the
       URL. The game reads those automatically; nothing else to configure.
     Option B: open the gear (Settings) and enter endpoint URL, key and secret.
       The Basic auth header is computed from key:secret in the browser.
     Option C: edit XAPI_DEFAULTS below.

  2. Actor identity
     Comes from the Docebo launch URL when available; otherwise from the
     Settings panel (name + email -> mbox). Stored in localStorage only.

  3. Testing from Docebo
     Settings -> "Test connection" fires a harmless `experienced` statement.
     Watch it arrive in Docebo's xAPI statement viewer (Reports / LRS) or an
     external LRS. Unsent statements are queued in localStorage and retried
     with exponential backoff; "Retry queue" forces a flush.

  4. Responsiveness inside the Docebo iframe
     Every dimension is relative to the frame the game is given (vw / vh /
     rem that scales with the frame). The board is a flex/grid layout that
     fills whatever width and height the iframe has, so nothing is ever
     clipped at desktop sizes; on very narrow frames (< 640px) the board
     reflows into stacked category columns and scrolls.

  xAPI statements emitted
     initialized  - new game / first load
     answered     - every clue (response, success, duration, score, extensions)
     scored       - running total after every clue
     completed    - all 30 clues used (score, accuracy, avg response time)
     experienced  - Settings "Test connection"
  ============================================================================
-->
<style>
  :root {
    --nf-red: #e50914;
    --nf-red-dark: #b20710;
    --nf-black: #000000;
    --nf-ink: #141414;
    --nf-panel: #1f1f1f;
    --nf-panel-2: #2b2b2b;
    --nf-line: #3a3a3a;
    --nf-gray: #b3b3b3;
    --nf-white: #ffffff;
    --ok: #46d369;
    --warn: #f5c518;
    --radius: 0.5rem;
    --gap: clamp(3px, 0.55vw, 10px);
    --shadow: 0 10px 30px rgba(0,0,0,.6);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* The root font size follows the frame: in an iframe, vw/vh are the iframe's
     own width/height, so every rem-based size scales with the frame. */
  html {
    font-size: clamp(11px, 0.6vw + 0.9vh, 19px);
    height: 100%;
    -webkit-text-size-adjust: 100%;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--nf-black);
    color: var(--nf-white);
    font-family: var(--font);
    line-height: 1.35;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .sr-only {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 3px solid var(--nf-white); outline-offset: 2px; }

  /* ---------------- Header ---------------- */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.45rem clamp(0.5rem, 1.2vw, 1.25rem);
    background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
    border-bottom: 2px solid var(--nf-red);
  }
  .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; letter-spacing: 0.02em; font-size: 1.1rem; white-space: nowrap; }
  .brand-n {
    display: inline-grid; place-items: center;
    width: 1.6em; height: 1.6em; border-radius: 0.2em;
    background: var(--nf-red); color: #fff; font-weight: 900; font-size: 1.05em;
    box-shadow: 0 2px 8px rgba(229,9,20,.45);
  }
  .brand small { font-weight: 500; color: var(--nf-gray); font-size: 0.7em; margin-left: 0.25rem; }
  .score-wrap { margin-left: auto; display: flex; align-items: baseline; gap: 0.5rem; }
  .score-label { color: var(--nf-gray); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .score { font-weight: 900; font-size: clamp(1.1rem, 1.5rem, 2rem); font-variant-numeric: tabular-nums; transition: transform .2s; }
  .score.neg { color: var(--nf-red); }
  .score.bump { transform: scale(1.12); }
  .progress { color: var(--nf-gray); font-size: 0.8rem; white-space: nowrap; }
  .icon-btn {
    background: transparent; color: var(--nf-white); border: 1px solid var(--nf-line);
    border-radius: 50%; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; font-size: 1.15rem;
  }
  .icon-btn:hover { border-color: var(--nf-red); color: var(--nf-red); }

  /* ---------------- Board ---------------- */
  main {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    padding: var(--gap);
  }
  .board {
    flex: 1 1 auto; min-height: 0;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: minmax(0, auto) repeat(5, minmax(2.2rem, 1fr));
    grid-auto-flow: column;
    gap: var(--gap);
    overflow: auto;            /* only kicks in if the frame is too short for 5 rows */
  }
  .category { display: contents; }   /* children flow straight into the 6x6 grid */
  .cat-head {
    display: flex; align-items: center; justify-content: center;   /* vertically centered */
    text-align: center;
    min-height: 3.2em;
    padding: 0.45em 0.4em;
    background: linear-gradient(180deg, var(--nf-panel-2), var(--nf-panel));
    border: 1px solid var(--nf-line);
    border-bottom: 3px solid var(--nf-red);
    border-radius: var(--radius) var(--radius) 0 0;
    font-weight: 700;
    font-size: clamp(0.7rem, min(1.35vw, 2.6vh), 1.15rem);
    line-height: 1.2;
    overflow-wrap: anywhere;
    hyphens: auto;
    position: sticky; top: 0; z-index: 2;   /* stays visible if the board ever scrolls */
  }
  .tile {
    position: relative;
    min-height: 0; width: 100%;
    display: grid; place-items: center;
    background: linear-gradient(180deg, #1c1c1c 0%, #0e0e0e 100%);
    color: var(--nf-red);
    border: 1px solid #2c2c2c;
    border-radius: var(--radius);
    font-weight: 900;
    font-size: clamp(0.9rem, min(3vw, 6.5vh), 3rem);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 6px rgba(0,0,0,.5);
    transition: background .15s, color .15s, transform .15s;
  }
  .tile:hover:not(:disabled), .tile:focus-visible:not(:disabled) {
    background: linear-gradient(180deg, #ff1f2a, var(--nf-red-dark));
    color: #fff; transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(229,9,20,.4);
  }
  .tile:disabled, .tile.used {
    cursor: default; color: #4a4a4a; text-decoration: line-through;
    background: #0a0a0a; border-color: #1a1a1a; box-shadow: none;
  }
  .tile.used::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 6px, transparent 6px 12px);
  }
  .tile .dd-mark { position: absolute; inset: 0; } /* nothing visible: Daily Double stays secret */

  /* Narrow frames: stacked category columns, scrolling board */
  @media (max-width: 640px) {
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: none;
      grid-auto-flow: row;
      align-content: start;
      overflow: auto;
    }
    .category { display: flex; flex-direction: column; gap: var(--gap); }
    .cat-head { position: static; min-height: 3.6em; }
    .tile { min-height: 3rem; font-size: clamp(1rem, 6vw, 1.6rem); }
  }
  @media (max-width: 420px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .brand small { display: none; }
  }

  /* ---------------- Buttons ---------------- */
  .btn {
    background: var(--nf-red); color: #fff; border: 0; border-radius: 0.3rem;
    padding: 0.6rem 1.1rem; font-weight: 700; letter-spacing: 0.01em;
    box-shadow: 0 2px 8px rgba(229,9,20,.35);
  }
  .btn:hover:not(:disabled) { background: #ff1f2a; }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn-ghost {
    background: transparent; color: var(--nf-gray); border: 1px solid var(--nf-line);
    border-radius: 0.3rem; padding: 0.55rem 0.9rem; font-weight: 600;
  }
  .btn-ghost:hover:not(:disabled) { color: #fff; border-color: #777; }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.85rem; }

  /* ---------------- Dialog ---------------- */
  .dialog {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(0.4rem, 2vh, 1.5rem);
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(3px);
  }
  .dialog[hidden] { display: none; }
  .dlg-panel {
    width: min(100%, 58rem);
    max-height: 100%;
    overflow: auto;
    background: linear-gradient(180deg, #202020, #121212);
    border: 1px solid #333;
    border-top: 4px solid var(--nf-red);
    border-radius: 0.75rem;
    box-shadow: var(--shadow);
    padding: clamp(0.75rem, 2.2vh, 1.6rem) clamp(0.9rem, 2.6vw, 2rem);
  }
  .dlg-head { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .dlg-cat { font-weight: 700; color: var(--nf-gray); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8rem; }
  .dlg-value { font-weight: 900; color: var(--nf-red); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .dlg-value small { color: var(--nf-gray); font-weight: 600; font-size: 0.7rem; margin-left: 0.3rem; }
  .dd-badge {
    background: var(--warn); color: #000; font-weight: 900; font-size: 0.75rem;
    padding: 0.2rem 0.5rem; border-radius: 0.25rem; letter-spacing: 0.06em;
  }
  .timer {
    margin-left: auto; position: relative; width: clamp(2.8rem, 9vh, 4.2rem); aspect-ratio: 1; flex: 0 0 auto;
  }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer .t-bg { fill: none; stroke: #333; stroke-width: 3.5; }
  .timer .t-fg { fill: none; stroke: var(--ok); stroke-width: 3.5; stroke-linecap: round;
    stroke-dasharray: 100.53; stroke-dashoffset: 0; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .timer.warn .t-fg { stroke: var(--warn); }
  .timer.danger .t-fg { stroke: var(--nf-red); }
  .timer .t-num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .clue-text {
    font-size: clamp(1.05rem, 1rem + 0.8vw, 1.7rem);
    line-height: 1.35; font-weight: 500; margin: 0.4rem 0 0.9rem;
    text-wrap: balance;
  }

  /* Hint button with rollover tooltip */
  .hint-row { display: flex; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .hint-wrap { position: relative; display: inline-block; }
  .hint-btn {
    background: #262626; color: var(--warn); border: 1px solid #444; border-radius: 999px;
    padding: 0.3rem 0.75rem; font-size: 0.85rem; font-weight: 700;
  }
  .hint-btn:hover:not(:disabled), .hint-btn:focus-visible:not(:disabled) { border-color: var(--warn); background: #2f2a14; }
  .hint-btn:disabled { color: #8a8a8a; cursor: default; }
  .hint-tip {
    position: absolute; left: calc(100% + 0.6rem); top: 50%; z-index: 5;
    width: max-content; max-width: min(26rem, 55vw);
    background: #2b2b2b; color: #eee; border: 1px solid #555; border-radius: 0.5rem;
    padding: 0.55rem 0.75rem; font-size: 0.85rem; line-height: 1.3;
    box-shadow: 0 6px 18px rgba(0,0,0,.5);
    opacity: 0; transform: translate(-4px, -50%); pointer-events: none; transition: opacity .15s, transform .15s;
  }
  .hint-tip::after {
    content: ""; position: absolute; right: 100%; top: 50%; margin-top: -6px;
    border: 6px solid transparent; border-right-color: #555;
  }
  .hint-wrap:hover .hint-tip, .hint-btn:focus-visible + .hint-tip, .hint-wrap.show .hint-tip { opacity: 1; transform: translate(0, -50%); }
  @media (max-width: 640px) {   /* narrow frames: tooltip sits above the button instead */
    .hint-tip { left: 0; top: auto; bottom: calc(100% + 0.5rem); max-width: 80vw; transform: translate(0, 4px); }
    .hint-tip::after { right: auto; left: 1rem; top: 100%; margin-top: 0; border-right-color: transparent; border-top-color: #555; }
    .hint-wrap:hover .hint-tip, .hint-btn:focus-visible + .hint-tip, .hint-wrap.show .hint-tip { transform: none; }
  }
  .hint-reveal {
    flex: 1 1 14rem; background: #2f2a14; border: 1px solid #5b4d12; color: #ffe58a;
    border-radius: 0.4rem; padding: 0.45rem 0.7rem; font-size: 0.92rem;
  }
  .hint-reveal[hidden] { display: none; }

  .answer-form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .answer-form input {
    flex: 1 1 14rem; min-width: 0;
    background: #0d0d0d; color: #fff; border: 1px solid #444; border-radius: 0.35rem;
    padding: 0.65rem 0.8rem; font-size: 1.05rem;
  }
  .answer-form input:focus-visible { border-color: var(--nf-red); outline: 2px solid #fff; outline-offset: 0; }
  .answer-form input.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px);} 75% { transform: translateX(4px);} }
  .format-note { color: var(--nf-gray); font-size: 0.82rem; margin: 0.5rem 0 0; }
  .form-error { color: var(--warn); font-weight: 600; font-size: 0.9rem; margin: 0.4rem 0 0; }
  .form-error[hidden] { display: none; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.9rem; flex-wrap: wrap; }

  .result { margin-top: 0.6rem; padding: 0.9rem 1rem; border-radius: 0.5rem; border: 1px solid #333; background: #181818; }
  .result[hidden] { display: none; }
  .result.ok { border-color: var(--ok); }
  .result.bad { border-color: var(--nf-red); }
  .result h3 { margin: 0 0 0.35rem; font-size: 1.15rem; }
  .result .correct-line { color: var(--nf-gray); }
  .result .correct-line strong { color: #fff; }
  .result .delta { font-weight: 900; font-variant-numeric: tabular-nums; }
  .result.ok .delta { color: var(--ok); }
  .result.bad .delta { color: var(--nf-red); }

  /* Wager dialog */
  .wager-form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.75rem; }
  .wager-form input { width: 9rem; background: #0d0d0d; color: #fff; border: 1px solid #444; border-radius: 0.35rem; padding: 0.6rem 0.8rem; font-size: 1.2rem; font-weight: 800; }
  .quick { display: flex; gap: 0.4rem; }
  .dlg-title { margin: 0 0 0.3rem; font-size: 1.6rem; font-weight: 900; }
  .dlg-title.dd { color: var(--warn); }
  .muted { color: var(--nf-gray); }

  /* Results */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.6rem; margin: 1rem 0; }
  .stats div { background: #181818; border: 1px solid #333; border-radius: 0.5rem; padding: 0.7rem; text-align: center; }
  .stats dt { color: var(--nf-gray); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .stats dd { margin: 0.2rem 0 0; font-weight: 900; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .final-score { font-size: clamp(2rem, 6vh, 3.2rem); font-weight: 900; margin: 0; color: var(--nf-red); }
  .missed { margin-top: 1rem; border-top: 1px solid #333; padding-top: 0.8rem; }
  .missed[hidden] { display: none; }
  .missed ul { list-style: none; padding: 0; margin: 0.5rem 0 0; display: grid; gap: 0.5rem; }
  .missed li { background: #181818; border: 1px solid #333; border-radius: 0.4rem; padding: 0.55rem 0.75rem; font-size: 0.92rem; }
  .missed li .q { color: var(--nf-gray); }

  /* ---------------- Settings slide-over ---------------- */
  .settings {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    width: min(100%, 26rem);
    background: #161616; border-left: 1px solid #333; box-shadow: var(--shadow);
    padding: 1rem 1.1rem; overflow: auto;
    transform: translateX(0); transition: transform .25s;
  }
  .settings[hidden] { display: none; }
  .settings h2 { margin: 0 0 0.5rem; font-size: 1.3rem; display: flex; align-items: center; }
  .settings h2 .icon-btn { margin-left: auto; }
  .settings fieldset { border: 1px solid #333; border-radius: 0.5rem; padding: 0.6rem 0.8rem 0.8rem; margin: 0 0 0.8rem; }
  .settings legend { color: var(--nf-gray); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 0.3rem; }
  .settings label { display: block; font-size: 0.85rem; color: #ddd; margin-top: 0.5rem; }
  .settings input[type=text], .settings input[type=email], .settings input[type=url], .settings input[type=password] {
    width: 100%; margin-top: 0.2rem; background: #0d0d0d; color: #fff; border: 1px solid #444; border-radius: 0.3rem; padding: 0.45rem 0.6rem;
  }
  .settings input:disabled { opacity: .55; }
  .settings .check { display: flex; align-items: center; gap: 0.5rem; }
  .settings .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--nf-red); }
  .settings .range { display: flex; align-items: center; gap: 0.6rem; }
  .settings .range input { flex: 1; accent-color: var(--nf-red); }
  .settings .btns { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
  .lms-note { background: #152a17; border: 1px solid #2f6b37; color: #bfe8c4; border-radius: 0.4rem; padding: 0.5rem 0.7rem; font-size: 0.85rem; }
  .lms-note[hidden] { display: none; }
  .xapi-status { font-size: 0.82rem; color: var(--nf-gray); margin: 0.6rem 0 0; min-height: 1.2em; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 55; }
  .scrim[hidden] { display: none; }

  /* ---------------- Toasts ---------------- */
  .toasts { position: fixed; top: 0.6rem; left: 50%; transform: translateX(-50%); z-index: 70; display: grid; gap: 0.4rem; pointer-events: none; width: min(92vw, 28rem); }
  .toast {
    background: #222; color: #fff; border-left: 4px solid var(--nf-gray); border-radius: 0.4rem;
    padding: 0.55rem 0.8rem; font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow);
    animation: toast-in .2s ease-out;
  }
  .toast.ok { border-color: var(--ok); }
  .toast.bad { border-color: var(--nf-red); }
  .toast.warn { border-color: var(--warn); }
  .toast.dd { border-color: var(--warn); background: #2f2a14; color: #ffe58a; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px);} to { opacity: 1; transform: none;} }

  /* ---------------- Confetti ---------------- */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
  .confetti span {
    position: absolute; top: -2vh; width: 0.6rem; height: 0.9rem; border-radius: 2px;
    animation: fall 1.6s ease-in forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-n" aria-hidden="true">N</span>Netflix Jeopardy <small>Round 1</small></div>
  <div class="progress" id="progress" aria-label="Clues remaining"></div>
  <div class="score-wrap">
    <span class="score-label">Score</span>
    <span class="score" id="score" role="status" aria-live="polite">$0</span>
  </div>
  <button class="icon-btn" id="btnSettings" aria-label="Open settings" aria-expanded="false" aria-controls="settings">&#9881;</button>
</header>

<main>
  <section class="board" id="board" aria-label="Game board: 6 categories, 5 clues each"></section>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="sr-only" id="announcer" aria-live="polite"></div>

<div class="dialog" id="dialog" hidden>
  <div class="dlg-panel" id="dlgPanel" role="dialog" aria-modal="true" aria-labelledby="dlgLabel"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="settings" id="settings" hidden aria-label="Settings">
  <h2>Settings <button class="icon-btn" id="btnCloseSettings" aria-label="Close settings">&times;</button></h2>
  <p class="lms-note" id="lmsNote" hidden>Launched from the LMS: endpoint, credentials and player identity were supplied by Docebo and can't be edited here.</p>
  <form id="settingsForm">
    <fieldset>
      <legend>Player (xAPI actor)</legend>
      <label>Display name <input type="text" id="sName" autocomplete="name"></label>
      <label>Email <input type="email" id="sEmail" autocomplete="email" placeholder="you@example.com"></label>
    </fieldset>
    <fieldset>
      <legend>LRS (Docebo)</legend>
      <label>Endpoint URL <input type="url" id="sEndpoint" placeholder="https://your-domain.docebosaas.com/lrs/xapi/"></label>
      <label>Key <input type="text" id="sKey" autocomplete="off"></label>
      <label>Secret <input type="password" id="sSecret" autocomplete="off"></label>
    </fieldset>
    <fieldset>
      <legend>Gameplay</legend>
      <label class="check"><input type="checkbox" id="sHints"> Hints available (halves the clue value, no penalty on a miss)</label>

const isoDuration = ms => { const s = Math.max(0, ms) / 1000; if (s < 60) return `PT${s.toFixed(1)}S`; const m = Math.floor(s / 60); return `PT${m}M${Math.round(s - m * 60)}S`; };

function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function answerMatches(raw, clue) {
  const user = stripQuestionAndArticles(raw);
  if (!user) return false;
  const candidates = [clue.correctAnswer, ...(clue.acceptedAlternates || [])].map(stripQuestionAndArticles).filter(Boolean);
  return candidates.some(c => {
    if (c === user) return true;
    if (/^\d+$/.test(c) || /^\d+$/.test(user)) return false;  // numbers must match exactly
    const tol = c.length <= 4 ? 0 : c.length <= 8 ? 1 : 2;
    return levenshtein(user, c) <= tol;
  });
}

  const p = new URLSearchParams(location.search);

  if (p.get("endpoint")) out.endpoint = p.get("endpoint");
  if (p.get("auth")) out.auth = p.get("auth");
  if (p.get("activity_id")) out.activityId = p.get("activity_id");
  if (p.get("registration")) out.registration = p.get("registration");

      const a = JSON.parse(p.get("actor"));
      const first = v => Array.isArray(v) ? v[0] : v;   // Tin Can 0.9 launchers send arrays

      if (a.mbox) actor.mbox = first(a.mbox);

      if (a.account) actor.account = first(a.account);
      out.actor = actor;
    } catch { /* ignore malformed actor */ }
  }
  return out;
}

  statement(verbKey, object, result, extensions, extraContext) {

        extensions: Object.assign({ [EXT + "app"]: XAPI_DEFAULTS.appName }, extensions || {}),
      }, extraContext || {}),
      timestamp: new Date().toISOString(),

    if (c.registration) stmt.context.registration = c.registration;
    if (result) stmt.result = result;

  enqueue(stmt) {

  async post(stmt) {
    const c = this.config();

      headers: { "Content-Type": "application/json", "X-Experience-API-Version": "1.0.3", "Authorization": c.auth },
      body: JSON.stringify(stmt),

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

  record(entry) {
    this.log.push(Object.assign({ at: new Date().toISOString() }, entry));

  },
  async flush(force = false) {
    if (this.flushing) { this.pending = true; return; }   // a flush is running: it will loop again for us
    this.flushing = true;
    try {
      if (!this.ready()) { UI.setXapiStatus("No LRS configured: statements are queued locally (" + this.queue.length + ")."); return; }
      let failed = false;
      do {
        this.pending = false;
        const now = Date.now();
        for (const item of this.queue.slice()) {           // statements go out in the order they were created
          if (!force && item.nextAt > now) continue;
          try {
            await this.post(item.statement);
            this.queue = this.queue.filter(q => q !== item);
            this.record({ ok: true, id: item.statement.id, verb: item.statement.verb.display["en-US"] });
          } catch (err) {
            failed = true;
            item.attempts += 1;
            item.nextAt = Date.now() + Math.min(5 * 60 * 1000, 2000 * 2 ** item.attempts);   // exponential backoff, max 5 min
            item.lastError = String(err.message || err);
            this.record({ ok: false, id: item.statement.id, verb: item.statement.verb.display["en-US"], error: item.lastError });
          }
        }

      storage.set(STORAGE.queue, this.queue);
      UI.updateQueueCount();
      if (failed) {
        UI.toast("xAPI delivery failed; will retry.", "bad");
        UI.setXapiStatus(`Last error: ${this.queue[0]?.lastError || "network"}. ${this.queue.length} queued.`);
        this.scheduleRetry();
      } else if (this.queue.length === 0) {
        UI.setXapiStatus("All statements delivered.");
      }
    } finally { this.flushing = false; }
  },

    return this.enqueue(this.statement("scored", { id: c.activityId },
      { score: { raw: total } },
      { [EXT + "scoreChange"]: delta, [EXT + "runningTotal"]: total, [EXT + "cluesAnswered"]: cluesDone, [EXT + "cluesTotal"]: 30 }));
  },
  sendCompleted(stats) {
    const c = this.config();
    return this.enqueue(this.statement("completed", { id: c.activityId, definition: { name: { "en-US": "Netflix Jeopardy Round 1" } } },
      { score: { raw: stats.score }, completion: true, success: stats.score > 0, duration: isoDuration(stats.durationMs) },
      { [EXT + "accuracy"]: stats.accuracy, [EXT + "avgResponseMs"]: stats.avgResponseMs, [EXT + "correct"]: stats.correct, [EXT + "hintsUsed"]: stats.hintsUsed }));
  },
  sendTest() {
    const c = this.config();
    return this.enqueue(this.statement("experienced", { id: c.activityId + "/self-test", definition: { name: { "en-US": "xAPI connection self-test" } } }, null, { [EXT + "selfTest"]: true }));
  },
};

/* ============================== GAME STATE ============================ */
let state = null;

function newState() {
  const cats = shuffle(CATEGORY_POOL).slice(0, 6).map(c => ({
    name: c.name, slug: slug(c.name),
    clues: c.clues.slice().sort((a, b) => a.value - b.value),   // always $200 -> $1000 top to bottom
  }));
  return {
    version: 2,
    categories: cats,
    used: {},
    score: 0,
    dailyDouble: { c: Math.floor(Math.random() * 6), r: Math.floor(Math.random() * 5) },
    answers: [],
    startedAt: new Date().toISOString(),
    open: null,
    completed: false,
  };
}
const save = () => storage.set(STORAGE.state, state);
const key = (c, r) => `${c}-${r}`;
const cluesDone = () => Object.keys(state.used).length;
const isDailyDouble = (c, r) => state.dailyDouble.c === c && state.dailyDouble.r === r;

/* ================================ AUDIO =============================== */
const audio = {
  ctx: null,
  beep(freq = 660, dur = 0.12, type = "sine", vol = 0.15) {
    if (!settings.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + dur);
    } catch {}
  },
  select() { this.beep(520, 0.08, "square", 0.06); },
  correct() { this.beep(660, 0.1); setTimeout(() => this.beep(880, 0.18), 110); },
  wrong() { this.beep(220, 0.25, "sawtooth", 0.1); },
  dd() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.beep(f, 0.18, "triangle", 0.12), i * 120)); },
  tick() { this.beep(1000, 0.04, "square", 0.04); },
};

/* ================================= UI ================================= */
const UI = {
  boardEl: $("#board"), dialogEl: $("#dialog"), panelEl: $("#dlgPanel"),
  timerHandle: null, lastFocusedTile: null,

  renderBoard() {
    const board = this.boardEl;
    board.innerHTML = "";
    state.categories.forEach((cat, c) => {
      const col = document.createElement("div");
      col.className = "category";

      col.setAttribute("aria-labelledby", `cat-${c}`);
      const head = document.createElement("div");
      head.className = "cat-head"; head.id = `cat-${c}`;
      head.textContent = cat.name;                       // sentence case, as written in the data
      col.appendChild(head);
      cat.clues.forEach((clue, r) => {
        const used = !!state.used[key(c, r)];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tile" + (used ? " used" : "");
        btn.dataset.c = c; btn.dataset.r = r;
        btn.textContent = "$" + clue.value;
        btn.setAttribute("aria-label", `${cat.name} for $${clue.value}${used ? ", already played" : ""}`);

        btn.tabIndex = -1;
        btn.addEventListener("click", () => Game.openTile(c, r));
        col.appendChild(btn);
      });

    });

  },
  setRovingFocus(prefer) {

  },
  renderScore(delta) {
    const el = $("#score");

      el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 250);

    }
  },
  renderProgress() { $("#progress").textContent = `${30 - cluesDone()} clues left`; },

  toast(msg, kind = "") {

    setTimeout(() => t.remove(), 2600);
  },
  announce(msg) { $("#announcer").textContent = msg; },
  confetti() {

    const wrap = document.createElement("div"); wrap.className = "confetti"; wrap.setAttribute("aria-hidden", "true");
    const colors = ["#e50914", "#ffffff", "#f5c518", "#46d369"];

    setTimeout(() => wrap.remove(), 2400);
  },

  /* ---- dialog plumbing ---- */
  openDialog(html, opts = {}) {
    this.lastFocusedTile = document.activeElement && document.activeElement.classList.contains("tile") ? document.activeElement : null;
    this.panelEl.innerHTML = html;

  },

    $("#sHints").checked = !!settings.hints; $("#sRequireQ").checked = !!settings.requireQuestion; $("#sSound").checked = !!settings.sound;
    $("#sTimer").value = settings.timer; $("#sTimerVal").textContent = settings.timer;

    this.updateQueueCount();
  },

  openSettings() { this.renderSettings(); $("#settings").hidden = false; $("#scrim").hidden = false; $("#btnSettings").setAttribute("aria-expanded", "true"); $("#sName").disabled ? $("#sHints").focus() : $("#sName").focus(); },
  closeSettings() { $("#settings").hidden = true; $("#scrim").hidden = true; $("#btnSettings").setAttribute("aria-expanded", "false"); $("#btnSettings").focus(); },
};

/* ================================ GAME ================================ */
const Game = {
  start() {
    state = storage.get(STORAGE.state, null);
    const valid = state && state.version === 2 && Array.isArray(state.categories) && state.categories.length === 6;
    if (!valid) { state = newState(); save(); xapi.sendInitialized(); }
    UI.renderBoard();
    if (state.completed) { this.showResults(); return; }
    if (state.open) this.resumeOpen();
    else if (cluesDone() > 0) UI.toast("Welcome back: your game was restored.", "ok");
  },
  newGame() {
    this.stopTimer();
    state = newState(); save();
    xapi.sendInitialized();
    UI.dialogEl.hidden = true; UI.panelEl.innerHTML = "";
    UI.renderBoard();
    UI.toast("New board ready. Good luck!", "ok");
    const first = UI.boardEl.querySelector(".tile[tabindex='0']"); if (first) first.focus();
  },

  openTile(c, r) {
    if (state.used[key(c, r)] || state.open) return;
    audio.select();
    const clue = state.categories[c].clues[r];
    if (isDailyDouble(c, r)) {
      state.open = { c, r, phase: "wager", wager: null, hintUsed: false, remainingMs: settings.timer * 1000, startedAt: null };
      save();
      this.showWager();
    } else {
      state.open = { c, r, phase: "clue", wager: null, hintUsed: false, remainingMs: settings.timer * 1000, startedAt: Date.now() };
      save();
      this.showClue();
    }
  },
  resumeOpen() {
    const o = state.open;
    if (o.phase === "wager") this.showWager();
    else if (o.phase === "clue") { o.startedAt = Date.now() - ((settings.timer * 1000) - o.remainingMs); this.showClue(); UI.toast("Resumed with " + Math.ceil(o.remainingMs / 1000) + "s left.", "warn"); }
    else if (o.phase === "result") { this.showClue(); this.renderResult(o.result); }
  },

  /* ---- Daily Double wager ---- */
  wagerMax() { const clue = this.currentClue(); return Math.max(state.score, clue.value); },
  currentClue() { return state.categories[state.open.c].clues[state.open.r]; },
  currentCategory() { return state.categories[state.open.c]; },
  showWager() {
    audio.dd();
    const clue = this.currentClue(), max = this.wagerMax();
    UI.toast("Daily Double!", "dd");
    UI.openDialog(`
      <h2 class="dlg-title dd" id="dlgLabel">Daily Double!</h2>
      <p class="muted">Category: <strong>${escapeHtml(this.currentCategory().name)}</strong> &middot; Your score: <strong>${money(state.score)}</strong></p>
      <p>Wager between <strong>$5</strong> and <strong>${money(max)}</strong>. Win it or lose it.</p>
      <form class="wager-form" id="wagerForm" novalidate>
        <label class="sr-only" for="wagerInput">Wager amount</label>
        <input type="number" id="wagerInput" inputmode="numeric" min="5" max="${max}" step="1" value="${clue.value}">
        <span class="quick">
          <button type="button" class="btn-ghost btn-sm" data-w="${clue.value}">Tile value</button>
          <button type="button" class="btn-ghost btn-sm" data-w="${max}">All in</button>
        </span>
        <button type="submit" class="btn">Lock wager</button>
      </form>
      <p class="form-error" id="wagerError" hidden></p>`, { locked: true, focus: "#wagerInput" });
    const input = $("#wagerInput", UI.panelEl);
    UI.panelEl.querySelectorAll("[data-w]").forEach(b => b.addEventListener("click", () => { input.value = b.dataset.w; input.focus(); }));
    $("#wagerForm", UI.panelEl).addEventListener("submit", e => {
      e.preventDefault();
      let w = Math.floor(Number(input.value));
      if (!Number.isFinite(w) || w < 5 || w > max) { $("#wagerError", UI.panelEl).hidden = false; $("#wagerError", UI.panelEl).textContent = `Enter a whole-dollar wager from $5 to ${money(max)}.`; input.focus(); return; }
      state.open.wager = w; state.open.phase = "clue"; state.open.startedAt = Date.now(); save();
      this.showClue();
    });
  },

  /* ---- Clue dialog ---- */
  potential() { return state.open.wager ?? this.currentClue().value; },
  gainIfCorrect() { return state.open.hintUsed ? Math.floor(this.potential() / 2) : this.potential(); },
  lossIfWrong() { return state.open.hintUsed ? 0 : this.potential(); },
  showClue() {
    const o = state.open, clue = this.currentClue(), cat = this.currentCategory();
    const dd = o.wager != null;
    UI.openDialog(`
      <div class="dlg-head">
        <span class="dlg-cat" id="dlgLabel">${escapeHtml(cat.name)}</span>
        ${dd ? '<span class="dd-badge">DAILY DOUBLE</span>' : ""}
        <span class="dlg-value" id="dlgValue"></span>
        <div class="timer" id="timer" role="timer" aria-label="Time remaining">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="t-bg" cx="18" cy="18" r="16"/><circle class="t-fg" id="timerArc" cx="18" cy="18" r="16"/></svg>
          <span class="t-num" id="timerNum">${Math.ceil(o.remainingMs / 1000)}</span>
        </div>
      </div>
      <p class="clue-text">${escapeHtml(clue.prompt)}</p>
      <div class="hint-row" id="hintRow" ${settings.hints ? "" : "hidden"}>
        <span class="hint-wrap" id="hintWrap">
          <button type="button" class="hint-btn" id="hintBtn" aria-describedby="hintTip">&#128161; Hint</button>
          <span class="hint-tip" id="hintTip" role="tooltip"></span>
        </span>
        <div class="hint-reveal" id="hintReveal" hidden></div>
      </div>
      <form class="answer-form" id="answerForm" novalidate>
        <label class="sr-only" for="answerInput">Your response, phrased as a question</label>
        <input id="answerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="What is...? / Who is...?">
        <button type="submit" class="btn" id="submitBtn">Submit</button>
      </form>
      <p class="format-note">Phrase your response as a question: &ldquo;Who is&hellip;?&rdquo;, &ldquo;What is&hellip;?&rdquo;, &ldquo;Where is&hellip;?&rdquo;, &ldquo;When was&hellip;?&rdquo;</p>
      <p class="form-error" id="answerError" role="alert" hidden></p>
      <div class="dlg-foot" id="dlgFoot"><button type="button" class="btn-ghost btn-sm" id="forfeitBtn"></button></div>
      <div class="result" id="result" hidden></div>`, { locked: true, focus: "#answerInput" });

    this.refreshValueChip();
    const hintBtn = $("#hintBtn", UI.panelEl), hintWrap = $("#hintWrap", UI.panelEl);
    if (hintBtn) {
      if (o.hintUsed) this.revealHint(); else this.refreshHintTip();
      hintBtn.addEventListener("click", () => { if (!state.open.hintUsed) { state.open.hintUsed = true; save(); this.revealHint(); this.refreshValueChip(); UI.toast(`Hint used: now playing for ${money(this.gainIfCorrect())}, no penalty.`, "warn"); } });
      // touch devices have no hover: a tap on the wrapper shows the tooltip first
      hintWrap.addEventListener("touchstart", () => hintWrap.classList.add("show"), { passive: true });
    }
    $("#forfeitBtn", UI.panelEl).addEventListener("click", () => {
      if (confirm(`Forfeit this clue? You'll lose ${money(this.lossIfWrong())}.`)) this.resolve({ forfeited: true });
    });
    $("#answerForm", UI.panelEl).addEventListener("submit", e => { e.preventDefault(); this.submit(); });
    if (o.phase === "clue") this.startTimer();
  },
  refreshValueChip() {
    const chip = $("#dlgValue", UI.panelEl); if (!chip) return;
    chip.innerHTML = `${money(this.gainIfCorrect())}${state.open.hintUsed ? `<small>hint used (was ${money(this.potential())})</small>` : state.open.wager != null ? "<small>wager</small>" : ""}`;
    const f = $("#forfeitBtn", UI.panelEl); if (f) f.textContent = `Forfeit (${state.open.hintUsed ? "no penalty" : "-" + money(this.lossIfWrong())})`;
    this.refreshHintTip();
  },
  refreshHintTip() {
    const tip = $("#hintTip", UI.panelEl); if (!tip || state.open.hintUsed) return;
    tip.textContent = `Reveal a hint? A correct response pays ${money(Math.floor(this.potential() / 2))} instead of ${money(this.potential())}, and a miss costs nothing.`;
  },
  revealHint() {
    const clue = this.currentClue();
    const btn = $("#hintBtn", UI.panelEl), tip = $("#hintTip", UI.panelEl), box = $("#hintReveal", UI.panelEl);
    if (btn) { btn.disabled = true; btn.innerHTML = "&#128161; Hint used"; }
    if (tip) tip.textContent = "Hint: " + clue.hint;
    if (box) { box.hidden = false; box.textContent = "Hint: " + clue.hint; }
    $("#answerInput", UI.panelEl)?.focus();
  },

  /* ---- timer ---- */
  startTimer() {
    this.stopTimer();
    const total = settings.timer * 1000;
    let lastSaved = 0, lastTickSec = -1;
    const tick = () => {
      const o = state.open; if (!o || o.phase !== "clue") return;
      o.remainingMs = Math.max(0, total - (Date.now() - o.startedAt));
      const sec = Math.ceil(o.remainingMs / 1000);
      const arc = $("#timerArc", UI.panelEl), num = $("#timerNum", UI.panelEl), t = $("#timer", UI.panelEl);
      if (arc) arc.style.strokeDashoffset = (100.53 * (1 - o.remainingMs / total)).toFixed(2);
      if (num && sec !== lastTickSec) {
        num.textContent = sec; lastTickSec = sec;
        if (sec <= 5 && sec > 0) { audio.tick(); UI.announce(`${sec} seconds left`); }
        else if (sec === 10) UI.announce("10 seconds left");
      }
      if (t) { t.classList.toggle("warn", sec <= 10 && sec > 5); t.classList.toggle("danger", sec <= 5); }
      if (Date.now() - lastSaved > 1000) { lastSaved = Date.now(); save(); }
      if (o.remainingMs <= 0) { this.stopTimer(); this.resolve({ timedOut: true }); }
    };
    tick();
    this.timerHandle = setInterval(tick, 100);
  },
  stopTimer() { clearInterval(this.timerHandle); this.timerHandle = null; },

  /* ---- answer flow ---- */
  submit() {
    const input = $("#answerInput", UI.panelEl), err = $("#answerError", UI.panelEl);
    const raw = input.value.trim();
    if (!raw) { err.hidden = false; err.textContent = "Type a response first."; input.classList.add("shake"); setTimeout(() => input.classList.remove("shake"), 300); input.focus(); return; }
    if (settings.requireQuestion && !isQuestionFormat(raw)) {
      err.hidden = false; err.textContent = "Remember to phrase it as a question, like “What is…?” or “Who is…?”";
      input.classList.add("shake"); setTimeout(() => input.classList.remove("shake"), 300); input.focus(); return;
    }
    this.resolve({ response: raw });
  },
  resolve({ response = "", timedOut = false, forfeited = false }) {
    const o = state.open; if (!o || o.phase !== "clue") return;
    this.stopTimer();
    const clue = this.currentClue(), cat = this.currentCategory();
    const correct = !timedOut && !forfeited && answerMatches(response, clue);
    const delta = correct ? this.gainIfCorrect() : -this.lossIfWrong();
    const ms = Date.now() - o.startedAt;
    state.score += delta;
    state.used[key(o.c, o.r)] = true;
    const record = {
      category: cat.name, slug: cat.slug, value: clue.value, difficulty: clue.difficultyRank, prompt: clue.prompt,
      correctAnswer: clue.correctAnswer, questionForm: questionForm(clue),
      response, correct, timedOut, forfeited, hintUsed: o.hintUsed,
      dailyDouble: o.wager != null, wager: o.wager, potential: this.potential(), delta, ms, runningTotal: state.score,
      at: new Date().toISOString(),
    };
    state.answers.push(record);
    o.phase = "result"; o.result = record;
    save();
    UI.renderScore(delta); UI.renderProgress();
    xapi.sendAnswered(record);
    xapi.sendScored(delta, state.score, cluesDone());
    if (correct) { audio.correct(); UI.toast(`Correct! +${money(delta)}`, "ok"); if (delta >= 800) UI.confetti(); }
    else if (timedOut) { audio.wrong(); UI.toast("Time's up!", "bad"); }
    else if (forfeited) { UI.toast("Clue forfeited.", "warn"); }
    else { audio.wrong(); UI.toast(`Incorrect. ${delta ? money(delta) : "No penalty"}`, "bad"); }
    this.renderResult(record);
  },
  renderResult(rec) {
    UI.panelEl.dataset.locked = "";
    const form = $("#answerForm", UI.panelEl), foot = $("#dlgFoot", UI.panelEl), res = $("#result", UI.panelEl), timer = $("#timer", UI.panelEl);
    if (form) form.hidden = true;
    $("#answerError", UI.panelEl)?.setAttribute("hidden", "");
    $(".format-note", UI.panelEl)?.setAttribute("hidden", "");
    $("#hintRow", UI.panelEl)?.setAttribute("hidden", "");
    if (timer) timer.hidden = true;
    const title = rec.correct ? "Correct!" : rec.timedOut ? "Time's up" : rec.forfeited ? "Forfeited" : "Incorrect";
    res.hidden = false; res.className = "result " + (rec.correct ? "ok" : "bad");
    res.innerHTML = `
      <h3>${title} <span class="delta">${rec.delta >= 0 ? "+" : ""}${money(rec.delta)}</span></h3>
      ${rec.response ? `<p class="muted">You responded: &ldquo;${escapeHtml(rec.response)}&rdquo;</p>` : ""}
      <p class="correct-line">Correct response: <strong>${escapeHtml(rec.questionForm)}</strong></p>`;
    foot.innerHTML = `<button type="button" class="btn" id="continueBtn">${cluesDone() >= 30 ? "See results" : "Continue"}</button>`;
    $("#continueBtn", UI.panelEl).addEventListener("click", () => this.closeClue());
    $("#continueBtn", UI.panelEl).focus();
  },
  closeClue() {
    state.open = null; save();
    if (cluesDone() >= 30) this.finish();
    else UI.closeDialog();
  },

  /* ---- end of game ---- */
  stats() {
    const a = state.answers, answered = a.filter(x => !x.forfeited);
    const correct = a.filter(x => x.correct).length;
    const avgResponseMs = answered.length ? Math.round(answered.reduce((s, x) => s + x.ms, 0) / answered.length) : 0;
    return { score: state.score, correct, total: a.length, accuracy: a.length ? +(correct / a.length).toFixed(3) : 0,
      avgResponseMs, hintsUsed: a.filter(x => x.hintUsed).length, durationMs: Date.now() - new Date(state.startedAt).getTime() };
  },
  finish() {
    if (!state.completed) { state.completed = true; state.completedAt = new Date().toISOString(); save(); xapi.sendCompleted(this.stats()); }
    this.showResults();
    if (state.score > 0) UI.confetti();
  },
  showResults() {
    const s = this.stats();
    const missed = state.answers.filter(x => !x.correct);
    UI.openDialog(`
      <h2 class="dlg-title" id="dlgLabel">Game over</h2>
      <p class="final-score">${money(s.score)}</p>
      <dl class="stats">
        <div><dt>Correct</dt><dd>${s.correct}/${s.total}</dd></div>
        <div><dt>Accuracy</dt><dd>${Math.round(s.accuracy * 100)}%</dd></div>
        <div><dt>Avg response</dt><dd>${(s.avgResponseMs / 1000).toFixed(1)}s</dd></div>
        <div><dt>Hints used</dt><dd>${s.hintsUsed}</dd></div>
      </dl>
      <div class="dlg-foot" style="justify-content:flex-start">
        <button type="button" class="btn" id="playAgainBtn">Play again</button>
        <button type="button" class="btn-ghost" id="exportBtn">Export JSON</button>
        <button type="button" class="btn-ghost" id="reviewBtn" ${missed.length ? "" : "disabled"}>Review missed clues (${missed.length})</button>
      </div>
      <section class="missed" id="missed" hidden>
        <h3>Missed clues</h3>
        <ul>${missed.map(m => `<li><div class="q">${escapeHtml(m.category)} &middot; $${m.value}: ${escapeHtml(m.prompt)}</div><div>${escapeHtml(m.questionForm)}</div></li>`).join("")}</ul>
      </section>`, { locked: true, focus: "#playAgainBtn" });
    $("#playAgainBtn", UI.panelEl).addEventListener("click", () => this.newGame());
    $("#exportBtn", UI.panelEl).addEventListener("click", () => downloadSession());
    $("#reviewBtn", UI.panelEl).addEventListener("click", () => { const m = $("#missed", UI.panelEl); m.hidden = !m.hidden; });
  },
};

/* ============================ SESSION EXPORT ========================== */
function downloadSession() {
  const c = xapi.config();
  const data = {
    exportedAt: new Date().toISOString(),
    app: XAPI_DEFAULTS.appName,
    actor: c.actor, activityId: c.activityId, endpoint: c.endpoint, registration: c.registration || null,
    settings: { hints: settings.hints, requireQuestion: settings.requireQuestion, timer: settings.timer },
    game: { startedAt: state.startedAt, completedAt: state.completedAt || null, score: state.score, categories: state.categories.map(x => x.name),
      dailyDouble: state.dailyDouble, answers: state.answers, stats: Game.stats() },
    xapi: { queued: xapi.queue.length, pending: xapi.queue.map(q => ({ id: q.statement.id, verb: q.statement.verb.display["en-US"], attempts: q.attempts, lastError: q.lastError })), deliveryLog: xapi.log },
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `netflix-jeopardy-session-${Date.now()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============================== INPUT ================================ */
// Board: arrow keys move between tiles (used tiles skipped), Home/End jump within the row, Enter/Space opens.
UI.boardEl.addEventListener("keydown", e => {
  const t = e.target.closest(".tile"); if (!t) return;
  const c = +t.dataset.c, r = +t.dataset.r;
  const find = (cc, rr) => UI.boardEl.querySelector(`.tile[data-c="${cc}"][data-r="${rr}"]`);
  const step = (dc, dr) => { let cc = c + dc, rr = r + dr; while (cc >= 0 && cc < 6 && rr >= 0 && rr < 5) { const el = find(cc, rr); if (el && !el.disabled) return el; cc += dc; rr += dr; } return null; };
  let next = null;
  switch (e.key) {
    case "ArrowRight": next = step(1, 0); break;
    case "ArrowLeft": next = step(-1, 0); break;
    case "ArrowDown": next = step(0, 1); break;
    case "ArrowUp": next = step(0, -1); break;
    case "Home": next = [...UI.boardEl.querySelectorAll(`.tile[data-r="${r}"]:not(:disabled)`)][0]; break;
    case "End": next = [...UI.boardEl.querySelectorAll(`.tile[data-r="${r}"]:not(:disabled)`)].pop(); break;
    case "Enter": case " ": e.preventDefault(); t.click(); return;
    default: return;
  }
  e.preventDefault();
  if (next) { UI.setRovingFocus(next); next.focus(); }
});
UI.boardEl.addEventListener("focusin", e => { const t = e.target.closest(".tile"); if (t) UI.setRovingFocus(t); });

// Dialog: focus trap; ESC only closes once the clue is resolved.
document.addEventListener("keydown", e => {
  if (UI.dialogEl.hidden) {
    if (e.key === "Escape" && !$("#settings").hidden) UI.closeSettings();
    return;
  }
  if (e.key === "Tab") {
    const f = UI.focusables(); if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (i === f.length - 1 || i === -1)) { e.preventDefault(); f[0].focus(); }
  } else if (e.key === "Escape") {
    if (UI.panelEl.dataset.locked) { UI.toast("Answer or forfeit the clue first.", "warn"); }
    else if (state.open && state.open.phase === "result") Game.closeClue();
  }
});
// Clicking the dark backdrop never dismisses a live clue.
UI.dialogEl.addEventListener("click", e => { if (e.target === UI.dialogEl && !UI.panelEl.dataset.locked && state.open?.phase === "result") Game.closeClue(); });

/* ============================= SETTINGS UI ============================ */
$("#btnSettings").addEventListener("click", () => UI.openSettings());
$("#btnCloseSettings").addEventListener("click", () => UI.closeSettings());
$("#scrim").addEventListener("click", () => UI.closeSettings());
$("#sTimer").addEventListener("input", e => $("#sTimerVal").textContent = e.target.value);
$("#settingsForm").addEventListener("submit", e => {
  e.preventDefault();
  if (!launchedByLms) {
    settings.name = $("#sName").value.trim() || "Player";
    settings.email = $("#sEmail").value.trim() || "player@example.com";
    settings.endpoint = $("#sEndpoint").value.trim();
    settings.key = $("#sKey").value.trim();
    settings.secret = $("#sSecret").value;
  }
  settings.hints = $("#sHints").checked;
  settings.requireQuestion = $("#sRequireQ").checked;
  settings.sound = $("#sSound").checked;
  settings.timer = Math.min(45, Math.max(15, +$("#sTimer").value || 30));
  storage.set(STORAGE.settings, settings);
  UI.toast("Settings saved.", "ok");
  UI.setXapiStatus(xapi.ready() ? "LRS configured." : "No LRS configured yet.");
  if (xapi.queue.length) xapi.flush(true);
});
$("#btnTest").addEventListener("click", async () => {
  if (!xapi.ready()) { UI.setXapiStatus("Enter the endpoint, key and secret (and save) before testing."); return; }
  UI.setXapiStatus("Sending test statement...");
  await xapi.sendTest();
  if (!xapi.queue.length) UI.toast("Test statement delivered.", "ok");
});
$("#btnRetry").addEventListener("click", () => xapi.flush(true));
$("#btnExport").addEventListener("click", () => downloadSession());
$("#btnNewGame").addEventListener("click", () => { if (confirm("Start a new game? The current board and score will be discarded.")) { UI.closeSettings(); Game.newGame(); } });
window.addEventListener("online", () => xapi.flush(true));

/* ================================ BOOT =============================== */
Game.start();
if (xapi.queue.length) xapi.flush(true);
if (!xapi.ready() && !launchedByLms) UI.setXapiStatus("No LRS configured: statements are queued locally.");

// Expose a couple of hooks for debugging from the console.
window.NetflixJeopardy = { get state() { return state; }, xapi, downloadSession, Game, settings };
})();
</script>
